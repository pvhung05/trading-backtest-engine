server.port=8081

# ==========================================
# Application
# ==========================================
spring.application.name=auth-service

# ==========================================
# DATABASE - H2 (Development)
# ==========================================
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (access at http://localhost:8081/h2-console)
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# ==========================================
app.jwt.secret=YOUR_256_BIT_JWT_SECRET_KEY_REPLACE_THIS_IN_PRODUCTION
app.jwt.expiration-ms=86400000

# ==========================================
# Misc
# ==========================================
spring.jackson.serialization.indent_output=true
