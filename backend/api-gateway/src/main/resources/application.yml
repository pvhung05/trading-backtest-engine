server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # Auth Service Route
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # Realtime Service STOMP WebSocket Route
        - id: realtime-service-ws
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/market/**

        # Backtest Service Market Load Route (takes precedence before general /api/market/**)
        - id: backtest-market-load
          uri: http://localhost:8083
          predicates:
            - Path=/api/market/load/**

        # Realtime Service REST Route
        - id: realtime-service-rest
          uri: http://localhost:8082
          predicates:
            - Path=/api/market/**

        # Backtest Service Engine Routes
        - id: backtest-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/backtest/**, /api/backtest-runs/**, /api/execution/**, /api/portfolio/**, /api/metrics/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
