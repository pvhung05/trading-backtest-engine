server.port=8084

# ==========================================
# Application
# ==========================================
spring.application.name=community-service

# ==========================================
# DATABASE - MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/backtest_trading_system?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=24022005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT (Matches auth-service)
# ==========================================
app.jwt.secret=YOUR_256_BIT_JWT_SECRET_KEY_REPLACE_THIS_IN_PRODUCTION
app.jwt.expiration-ms=86400000

# ==========================================
# Seed Data
# ==========================================
app.community.seed-data=true

# ==========================================
# Misc
# ==========================================
spring.jackson.serialization.indent_output=true
