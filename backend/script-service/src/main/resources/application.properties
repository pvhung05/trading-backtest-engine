server.port=8085
spring.application.name=script-service

# ==========================================
# DATABASE - MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/backtest_trading_system?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=24022005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# JWT
# ==========================================
app.jwt.secret=${JWT_SECRET:YOUR_256_BIT_JWT_SECRET_KEY_REPLACE_THIS_IN_PRODUCTION}

# ==========================================
# SERVICE ENDPOINTS
# ==========================================
app.backtest-service.url=http://localhost:8083

# ==========================================
# OpenAPI / Swagger
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
